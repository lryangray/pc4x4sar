name = "pc4x4sar"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for contact form submissions
# Run: wrangler kv namespace create CONTACT_SUBMISSIONS
# Then paste the returned id below
[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "c46cf36749f0404eb1f1b2f29e64487f"

# Production environment (default)
[assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true

# Preview environment
[env.preview]
name = "pc4x4sar-preview"

[[env.preview.kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "c46cf36749f0404eb1f1b2f29e64487f"

[env.preview.assets]
directory = "./out"
binding = "ASSETS"
run_worker_first = true
