name = "pc4x4sar"
main = "worker.js"
compatibility_date = "2024-01-01"

# KV namespace for contact form submissions
# Run: wrangler kv namespace create CONTACT_SUBMISSIONS
# Then paste the returned id below
[[kv_namespaces]]
binding = "CONTACT_SUBMISSIONS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Production environment (default)
[assets]
directory = "./out"
binding = "ASSETS"

# Preview environment
[env.preview]
name = "pc4x4sar-preview"

[env.preview.assets]
directory = "./out"
binding = "ASSETS"
